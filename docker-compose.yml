services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: excon
      POSTGRES_PASSWORD: excon
      POSTGRES_DB: excon
    volumes:
      - excon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excon -d excon"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://excon:excon@db:5432/excon
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      API_RELOAD: "true"
      UPLOAD_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./backend/docker-entrypoint.sh:/entrypoint.sh
      - excon_uploads:/data/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  excon_pgdata:
  excon_uploads:
